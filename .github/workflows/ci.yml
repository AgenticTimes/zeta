# CI for Zeta — runs on self-hosted Galaxy runner
name: CI
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  LLVM_SYS_210_PREFIX: /usr/lib/llvm-21
  LLVM_SYS_211_PREFIX: /usr/lib/llvm-21

jobs:
  check:
    runs-on: [self-hosted, galaxy, wsl2, x86-64]
    steps:
    - uses: actions/checkout@v4
    - name: Check
      run: cargo check --workspace --all-targets
    - name: Clippy
      run: cargo clippy --workspace --all-targets -- -D warnings
    - name: Fmt
      run: cargo fmt --all -- --check

  test:
    runs-on: [self-hosted, galaxy, wsl2, x86-64]
    needs: check
    steps:
    - uses: actions/checkout@v4
    - name: Test
      run: cargo test --workspace
    - name: Build release
      run: cargo build --release

  zeta-selfhost:
    runs-on: [self-hosted, galaxy, wsl2, x86-64]
    needs: test
    steps:
    - uses: actions/checkout@v4
    - name: Build release compiler
      run: |
        cargo build --release
        echo "zetac built successfully"
    - name: Compile zeta_src/ (全量 51 个文件，判据在 tools/selfhost_compile.sh)
      # 批次 347 / backlog #29：原步骤用 `for f in zeta_src/*.z`，而 zeta_src 的 51 个
      # `.z` 里有 46 个在子目录（middle/ frontend/ runtime/ …）——步骤名写 "all"，
      # 实际只覆盖顶层 5 个。现在覆盖全部，且已知失败的 4 个逐条钉住所因。
      run: ./tools/selfhost_compile.sh
      # 注：JIT 路径的回归判据不在这里，在 baselines job 的 run_all.sh 步骤 4
      #（tools/jit_sweep.sh）——本 job 的编译一律 `--no-link -o`，不执行被编译的程序。

  benchmark:
    runs-on: [self-hosted, galaxy, wsl2, x86-64]
    needs: test
    steps:
    - uses: actions/checkout@v4
    - name: Build release
      run: cargo build --release
    - name: Run benchmarks
      run: |
        echo "=== Zeta Compiler Performance ==="
        hyperfine --warmup 2 --runs 5 'cargo build --release 2>&1' 2>/dev/null || \
          echo "hyperfine not available - skipping"
        echo "=== Self-host compilation ==="
        time ./target/release/zetac ./zeta_src/main.z 2>&1

  # advice.md 任务 L：三套基线进 CI（Q4 run_all.sh）
  baselines:
    runs-on: [self-hosted, galaxy, wsl2, x86-64]
    needs: test
    steps:
    - uses: actions/checkout@v4
    - name: Ensure generated registry artifacts are fresh
      run: |
        python3 tools/gen_from_registry.py --emit --emit-core --emit-jit --emit-aliases
        git diff --exit-code -- \
          src/backend/codegen/runtime_decls_registry.rs \
          src/backend/codegen/runtime_decls_core.rs \
          src/backend/codegen/jit_mappings_gen.rs \
          runtime/aliases.inc.c
    - name: Build release zetac
      run: cargo build --release -p zetac
    - name: Registry ↔ runtime .o nm check
      run: python3 tools/gen_from_registry.py --check
    - name: Run three-suite baselines
      run: |
        mkdir -p artifacts
        OUT_JSON="$PWD/artifacts/zeta_baseline.json" ./tools/run_all.sh
    - name: Upload baseline JSON
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: zeta-baseline
        path: artifacts/zeta_baseline.json
        if-no-files-found: warn
